<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery - Daily Lesson Note</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .video-item {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            text-align: left;
        }
        .video-item:hover {
            transform: translateY(-5px);
        }
        .video-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .video-info {
            padding: 12px;
        }
        .video-info h4 {
            font-size: 14px;
            color: #333;
            margin: 0 0 10px 0;
            line-height: 1.4;
            height: 40px;
            overflow: hidden;
        }
        .watch-btn {
            display: block;
            text-align: center;
            background: #ff0000;
            color: white;
            text-decoration: none;
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }
        .watch-btn:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ଟପ୍ ନେଭିଗେସନ୍ ହେଡର୍ -->
        <header class="top-navbar">
            <div class="logo-section">
                <i class="fa-solid fa-video logo-icon"></i>
                <div class="site-title">
                    <h1>Video Gallery</h1>
                    <p style="color: #ffcc00; font-size: 14px; margin: 0;">Jagadish Govt UPS Regeda</p>
                </div>
            </div>
            
            <nav class="menu-section">
                <ul style="list-style: none; display: flex; gap: 20px; margin: 0; padding: 0;">
                    <li><a href="index.html" style="color: white; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 13px;"><i class="fa-solid fa-house" style="font-size: 20px; margin-bottom: 5px;"></i>Home</a></li>
                    <li><a href="book-library.html" style="color: white; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 13px;"><i class="fa-solid fa-book-journal-whills" style="font-size: 20px; margin-bottom: 5px;"></i>Books</a></li>
                    <li><a href="video-gallery.html" style="color: white; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 13px;"><i class="fa-brands fa-youtube" style="font-size: 20px; margin-bottom: 5px;"></i>Video</a></li>
                    <li><a href="#" style="color: white; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 13px;"><i class="fa-solid fa-bell" style="font-size: 20px; margin-bottom: 5px;"></i>Notice</a></li>
                </ul>
            </nav>
        </header>

        <!-- ମୁଖ୍ୟ କଣ୍ଟେଣ୍ଟ -->
        <div class="content">
            <div class="section-title">ଆମର ସମସ୍ତ ୟୁଟ୍ୟୁବ୍ ଭିଡିଓ ତାଲିକା</div>
            
            <!-- ୟୁଟ୍ୟୁବ୍ ଚ୍ୟାନେଲ୍ ଲିଙ୍କ୍ ବଟନ୍ -->
            <div style="text-align: center; margin-bottom: 20px;">
                <a href="https://www.youtube.com/@jagadishgovtupsregeda" target="_blank">
                    <button style="background: linear-gradient(135deg, #ff0000, #cc0000); width: auto; padding: 12px 25px; font-size: 16px;">
                        <i class="fa-brands fa-youtube"></i> ୟୁଟ୍ୟୁବ୍ ଚ୍ୟାନେଲ୍‌ରେ ସବୁ ଦେଖନ୍ତୁ
                    </button>
                </a>
            </div>

            <!-- ଭିଡିଓ ଗ୍ରୀଡ୍ ଏଠାରେ ଅଟୋମେଟିକ୍ ଆସିବ -->
            <div id="youtubeVideos" class="video-grid">
                <p style="text-align: center; width: 100%; color: #666;">ଭିଡିଓଗୁଡ଼ିକ ଲୋଡ୍ ହେଉଛି...</p>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <a href="index.html"><button style="background-color: #0044cc; width: auto; padding: 10px 20px;">← ପ୍ରଧାନ ପୃଷ୍ଠାକୁ ଫେରନ୍ତୁ</button></a>
            </div>
        </div>
    </div>

    <script>
        // ଆପଣଙ୍କ ୟୁଟ୍ୟୁବ୍ ଚ୍ୟାନେଲ୍ ID ଏଠାରେ ଦିଆଯାଇଛି
        const channelID = "UC_Your_Channel_ID"; // ଯଦି ଚ୍ୟାନେଲ୍ ID ନାହିଁ, ତେବେ RSS ପାଇଁ ନିମ୍ନୋକ୍ତ ମାଧ୍ୟମ କାମ କରିବ
        
        // Alternative: Fetching via rss2json API using channel handle or uploads
        // ସହଜ ପଦ୍ଧତିରେ ଚ୍ୟାନେଲ୍ ଭିଡିଓ ଫେଚ୍ କରିବା ପାଇଁ:
        fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.youtube.com%2Ffeeds%2Fvideos.xml%3Fchannel_id%3DUCL16uK7qXfO521633D6rLJA')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('youtubeVideos');
            if(data.items && data.items.length > 0) {
                container.innerHTML = "";
                data.items.forEach(item => {
                    // Get YouTube video ID from link
                    let ytId = item.link.split('v=')[1];
                    let thumbnailURL = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                    
                    let videoCard = `
                        <div class="video-item">
                            <img src="${thumbnailURL}" alt="${item.title}">
                            <div class="video-info">
                                <h4>${item.title}</h4>
                                <a href="${item.link}" target="_blank" class="watch-btn"><i class="fa-brands fa-youtube"></i> ଭିଡିଓ ଦେଖନ୍ତୁ</a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += videoCard;
                });
            } else {
                container.innerHTML = "<p style='text-align:center;'>କୌଣସି ଭିଡିଓ ମିଳିଲା ନାହିଁ।</p>";
            }
        })
        .catch(error => {
            document.getElementById('youtubeVideos').innerHTML = "<p style='text-align:center; color:red;'>ଭିଡିଓ ଲୋଡ୍ ହେବାରେ ସମସ୍ୟା ହେଲା। ଦୟାକରି ଉପର ବଟନ୍ କ୍ଲିକ୍ କରି ଚ୍ୟାନେଲ୍ ଦେଖନ୍ତୁ।</p>";
        });
    </script>
</body>
</html>
