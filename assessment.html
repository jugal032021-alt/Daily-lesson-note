<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Assessment Marks Entry | OdishaPathasala</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Oriya","Noto Sans Odia",Arial,sans-serif;background:#f3f6fb;color:#222}
.topbar{background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.topbar h2{margin:0;font-size:21px}.topbar small{opacity:.9}
.container{padding:15px;max-width:100%}
.controls{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:15px}
.controls-row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.control-box{display:flex;flex-direction:column;gap:5px}.control-box label{font-size:13px;font-weight:bold}
select{min-width:130px;padding:9px 10px;border:1px solid #aaa;border-radius:7px;background:#fff}
.btn{border:0;padding:10px 16px;border-radius:7px;cursor:pointer;color:#fff;font-weight:bold}
.btn-blue{background:#1565c0}.btn-green{background:#00897b}.btn-orange{background:#ef6c00}.btn-red{background:#c62828}.btn-gray{background:#546e7a}
.status{margin-top:10px;padding:9px 12px;border-radius:7px;background:#e3f2fd;color:#1565c0;font-size:14px}
.table-wrap{width:100%;overflow-x:auto;overflow-y:auto;max-height:78vh;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:max-content}
th,td{border-right:1px solid #999;border-bottom:1px solid #999;text-align:center;padding:4px;white-space:nowrap;height:40px}
thead th{position:sticky;z-index:20;font-weight:bold}
.header-main{top:0;background:#1565c0!important;color:#fff;font-size:15px}
.term1-head{background:#1976d2!important;color:#fff}.term2-head{background:#00897b!important;color:#fff}
.assessment-head{background:#e3f2fd!important;color:#0d47a1;font-size:13px}
.component-head{background:#f1f8e9!important;color:#1b5e20;font-size:12px}
thead tr:nth-child(1) th{top:0}thead tr:nth-child(2) th{top:38px}thead tr:nth-child(3) th{top:76px}thead tr:nth-child(4) th{top:114px}
.roll-col{width:60px;min-width:60px}.name-col{width:190px;min-width:190px}.gender-col{width:95px;min-width:95px}
.subject-head{min-width:300px}.component-col{width:90px;min-width:90px}
.total-col{width:80px;min-width:80px;background:#fff8e1;font-weight:bold}
.percent-col{width:100px;min-width:100px;background:#e8f5e9;font-weight:bold}
.sticky-name{position:sticky;left:0;z-index:40!important;background:#fff}
thead .sticky-name{background:#1565c0!important;color:#fff;z-index:60!important}
.student-name{width:180px;padding:7px;border:1px solid #aaa;border-radius:4px;text-transform:uppercase}
.mark-input{width:72px;padding:6px 3px;border:1px solid #aaa;border-radius:4px;text-align:center}
.mark-input:focus,.student-name:focus{outline:2px solid #42a5f5}
.total-value{color:#0d47a1;font-weight:bold}.term-percent{color:#00695c;font-weight:bold;line-height:1.35}
.overall-head{background:#6a1b9a!important;color:#fff!important;min-width:110px}
.overall-cell{background:#f3e5f5;color:#4a148c;font-weight:bold;line-height:1.4}
.footer-note{margin-top:12px;background:#fff;padding:12px;border-radius:10px;font-size:13px;color:#555}
@media(max-width:700px){.topbar h2{font-size:17px}.container{padding:8px}.name-col,.student-name{width:160px;min-width:160px}}
</style>
</head>
<body>
<div class="topbar">
<h2>📝 Assessment Marks Entry</h2>
<small>OdishaPathasala.in | NEP 2020 Assessment Framework</small>
</div>
<div class="container">
<div class="controls">
<div class="controls-row">
<div class="control-box">
<label>ଶ୍ରେଣୀ</label>
<select id="classSelect">
<option value="3">Class 3</option><option value="4">Class 4</option><option value="5">Class 5</option>
<option value="6">Class 6</option><option value="7">Class 7</option><option value="8">Class 8</option>
</select>
</div>
<button class="btn btn-blue" onclick="loadClass()">Load Class</button>
<button class="btn btn-green" onclick="addStudent()">+ Add Student</button>
<button class="btn btn-orange" onclick="saveLocal()">💾 Save</button>
<button class="btn btn-gray" onclick="exportExcel()">📊 Excel</button>
<button class="btn btn-red" onclick="clearAllData()">Clear</button>
</div>
<div id="status" class="status">Class select କରି Load Class କରନ୍ତୁ ।</div>
</div>
<div class="table-wrap">
<table id="assessmentTable"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
</div>
<div class="footer-note"><b>Assessment Framework:</b> ପ୍ରତ୍ୟେକ Subject ର Term 1 ଓ Term 2 automatic calculate ହେବ। Class 3–5 = 600 ଏବଂ Class 6–8 = 900 ରୁ Overall Percentage calculate ହେବ।</div>
</div>

<script>
const subjects={
3:["ଭାଷା ମହକ","Pallavi","ଗଣିତ ମେଳା","ଆମ ବିଚିତ୍ର ବିଶ୍ୱ","ଇନ୍ଦ୍ରଧନୁ","ଖେଳ ଓ ଯୋଗ"],
4:["ଭାଷା ମହକ","Pallavi","ଗଣିତ ମେଳା","ଆମ ବିଚିତ୍ର ବିଶ୍ୱ","ଇନ୍ଦ୍ରଧନୁ","କ୍ରୀଡ଼ା ଓ ଯୋଗ"],
5:["ଭାଷା ମହକ","Pallavi","ଗଣିତ ମେଳା","ଆମ ବିଚିତ୍ର ବିଶ୍ୱ","ନବରସ","ଖେଳ ଓ ଯୋଗ"],
6:["ସାହିତ୍ୟ ସୁଧା","Jasmine","ଗଣିତ ପ୍ରକାଶ","ଜିଜ୍ଞାସା","ଭାରତ ଓ ଆମ ପୃଥିବୀ","ହିନ୍ଦୀ କଳିକା","କଳାକୁଞ୍ଜ","କୌଶଳ ବୋଧ","ଖେଳ ଶିକ୍ଷା"],
7:["ସାହିତ୍ୟ ସୁମନ","Jasmine","ଗଣିତ ପ୍ରକାଶ","ଜିଜ୍ଞାସା","ଭାରତ ଓ ଆମ ପୃଥିବୀ","ହିନ୍ଦୀ କଳିକା","କୌଶଳ ବୋଧ","କଳାକୃତି","ଖେଳ ଶିକ୍ଷା"],
8:["ସାହିତ୍ୟ ସୁରଭି","Jasmine","ଗଣିତ ପ୍ରକାଶ","ଜିଜ୍ଞାସା","ଭାରତ ଓ ଆମ ପୃଥିବୀ","ହିନ୍ଦୀ କଳିକା","କୌଶଳ ବୋଧ","କୃତି","ଖେଳ ଶିକ୍ଷା"]
};

const class35Normal={
formative:[["ମୌଖିକ",5],["ଲିଖିତ",15],["କାର୍ଯ୍ୟଦକ୍ଷତା",5],["ମୋଟ",25]],
observation:[["ଲିଖିତ",10],["ପ୍ରକଳ୍ପ",15],["ମୋଟ",25]],
summative:[["ମୌଖିକ",10],["ଲିଖିତ",40],["ମୋଟ",50]]
};

const class35Art={
formative:[["ଲିଖିତ",10],["ପ୍ରଦର୍ଶନଭିତ୍ତିକ",15],["ମୋଟ",25]],
observation:[["ଦୃଶ୍ୟକଳା",10],["ସଙ୍ଗୀତ",5],["ନୃତ୍ୟ",5],["ନାଟକ",5],["ମୋଟ",25]],
summative:[["ପ୍ରଦର୍ଶନଭିତ୍ତିକ",30],["ଲିଖିତ",20],["ମୋଟ",50]]
};

const class35Sports={
formative:[["ଲିଖିତ",10],["ପ୍ରଦର୍ଶନଭିତ୍ତିକ",15],["ମୋଟ",25]],
observation:[["ଶାରୀରିକ ଆକଳନ",10],["ଖେଳ ଓ କ୍ରୀଡ଼ା",5],["ଯୋଗ ଓ ପ୍ରାଣାୟାମ",10],["ମୋଟ",25]],
summative:[["ପ୍ରଦର୍ଶନଭିତ୍ତିକ",30],["ଲିଖିତ",20],["ମୋଟ",50]]
};

const class68Normal={
formative:[["ମୌଖିକ",5],["ଲିଖିତ",15],["କାର୍ଯ୍ୟଦକ୍ଷତା",5],["ମୋଟ",25]],
observation:[["ଲିଖିତ",10],["ପ୍ରକଳ୍ପ",10],["ଶିକ୍ଷାର୍ଥୀଙ୍କ ଡାଏରୀ",5],["ମୋଟ",25]],
summative:[["ଲିଖିତ",50],["ମୋଟ",50]]
};

const class68Art={
formative:[["ଲିଖିତ",10],["ପ୍ରଦର୍ଶନଭିତ୍ତିକ",15],["ମୋଟ",25]],
observation:[["ଚିତ୍ରକଳା",10],["ସଙ୍ଗୀତ",5],["ନୃତ୍ୟ",5],["ନାଟକ",5],["ମୋଟ",25]],
summative:[["ପ୍ରଦର୍ଶନଭିତ୍ତିକ",30],["ଲିଖିତ",20],["ମୋଟ",50]]
};

const class68Skill={
formative:[["ଲିଖିତ",5],["ପ୍ରକଳ୍ପ",20],["ମୋଟ",25]],
observation:[["ଦକ୍ଷତା",5],["ବୋଧଗମ୍ୟତା",5],["କାର୍ଯ୍ୟପ୍ରତି ମନୋଭାବ",5],["ସମାପ୍ତ କାର୍ଯ୍ୟ",5],["ବାସ୍ତବ ଜୀବନରେ ପ୍ରୟୋଗ",5],["ମୋଟ",25]],
summative:[["ଲିଖିତ",20],["ପ୍ରକଳ୍ପ",30],["ମୋଟ",50]]
};

const class68Sports={
formative:[["ଲିଖିତ",10],["ପ୍ରଦର୍ଶନଭିତ୍ତିକ",15],["ମୋଟ",25]],
observation:[["ମୌଳିକ ବ୍ୟାୟାମ",10],["କ୍ରୀଡ଼ା",5],["ଯୋଗ ଓ ପ୍ରାଣାୟାମ",10],["ମୋଟ",25]],
summative:[["ପ୍ରଦର୍ଶନଭିତ୍ତିକ",30],["ଲିଖିତ",20],["ମୋଟ",50]]
};

function getStructure(cls,subject){
cls=Number(cls);
if(cls<=5){
if(subject==="ଇନ୍ଦ୍ରଧନୁ"||subject==="ନବରସ")return class35Art;
if(subject==="ଖେଳ ଓ ଯୋଗ"||subject==="କ୍ରୀଡ଼ା ଓ ଯୋଗ")return class35Sports;
return class35Normal;
}
if(subject==="କଳାକୁଞ୍ଜ"||subject==="କଳାକୃତି"||subject==="କୃତି")return class68Art;
if(subject==="କୌଶଳ ବୋଧ")return class68Skill;
if(subject==="ଖେଳ ଶିକ୍ଷା")return class68Sports;
return class68Normal;
}

let currentClass=3,students=[];

function $(id){return document.getElementById(id)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function safe(t){return String(t).replace(/[^\w\u0B00-\u0B7F]+/g,"_")}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function getMarks(st,sub,term,group,index){
if(!st.marks||!st.marks[sub]||!st.marks[sub][term]||!st.marks[sub][term][group])return "";
return st.marks[sub][term][group][index]??"";
}

function renderTable(){
const list=subjects[currentClass]||[];
let row1=`<tr><th class="header-main roll-col" rowspan="4">ରୋଲ ନଂ.</th><th class="header-main name-col sticky-name" rowspan="4">ଛାତ୍ର/ଛାତ୍ରୀ ନାମ</th><th class="header-main gender-col" rowspan="4">ଲିଙ୍ଗ</th>`;
let row2="<tr>",row3="<tr>",row4="<tr>";

list.forEach(subject=>{
const s=getStructure(currentClass,subject);
const n=s.formative.length+s.observation.length+s.summative.length;
row1+=`<th class="header-main subject-head" colspan="${(n+1)*2}">${esc(subject)}</th>`;
row2+=`<th class="term1-head" colspan="${n+1}">TERM 1</th><th class="term2-head" colspan="${n+1}">TERM 2</th>`;
row3+=`<th class="assessment-head" colspan="${s.formative.length}">ଗଠନମୂଳକ ଆକଳନ–୧</th><th class="assessment-head" colspan="${s.observation.length}">ଶିକ୍ଷକ ପର୍ଯ୍ୟବେକ୍ଷଣ–୧</th><th class="assessment-head" colspan="${s.summative.length}">ସମାପ୍ତିସୂଚକ ଆକଳନ–୧</th><th class="percent-col" rowspan="2">T1 %</th><th class="assessment-head" colspan="${s.formative.length}">ଗଠନମୂଳକ ଆକଳନ–୨</th><th class="assessment-head" colspan="${s.observation.length}">ଶିକ୍ଷକ ପର୍ଯ୍ୟବେକ୍ଷଣ–୨</th><th class="assessment-head" colspan="${s.summative.length}">ସମାପ୍ତିସୂଚକ ଆକଳନ–୨</th><th class="percent-col" rowspan="2">T2 %</th>`;
const add=a=>a.map(x=>`<th class="component-head">${esc(x[0])}${x[0]!=="ମୋଟ"?`<br>(${x[1]})`:""}</th>`).join("");
row4+=add(s.formative)+add(s.observation)+add(s.summative)+add(s.formative)+add(s.observation)+add(s.summative);
});

row1+=`<th class="overall-head" rowspan="4">TERM 1<br>OVERALL %</th><th class="overall-head" rowspan="4">TERM 2<br>OVERALL %</th>`;
$("tableHead").innerHTML=row1+"</tr>"+row2+"</tr>"+row3+"</tr>"+row4+"</tr>";

let body="";
students.forEach((st,si)=>{
body+=`<tr><td class="roll-col">${si+1}</td><td class="sticky-name"><input class="student-name" value="${esc(st.name||"")}" placeholder="STUDENT NAME" oninput="updateName('${st.id}',this.value)"></td><td class="gender-col"><select onchange="updateGender('${st.id}',this.value)"><option value="">Select</option><option value="Boys" ${st.gender==="Boys"?"selected":""}>Boys</option><option value="Girls" ${st.gender==="Girls"?"selected":""}>Girls</option></select></td>`;

list.forEach(sub=>{
const s=getStructure(currentClass,sub);
body+=renderGroup(st,sub,"t1","formative",s.formative);
body+=renderGroup(st,sub,"t1","observation",s.observation);
body+=renderGroup(st,sub,"t1","summative",s.summative);
body+=`<td id="percent_${st.id}_${safe(sub)}_t1" class="percent-col term-percent">0.0%</td>`;
body+=renderGroup(st,sub,"t2","formative",s.formative);
body+=renderGroup(st,sub,"t2","observation",s.observation);
body+=renderGroup(st,sub,"t2","summative",s.summative);
body+=`<td id="percent_${st.id}_${safe(sub)}_t2" class="percent-col term-percent">0.0%</td>`;
});

const max=currentClass<=5?600:900;
body+=`<td id="overall_t1_${st.id}" class="overall-cell">0/${max}<br><b>0.0%</b></td><td id="overall_t2_${st.id}" class="overall-cell">0/${max}<br><b>0.0%</b></td></tr>`;
});

body+=`<tr><td colspan="3" style="padding:10px"><button class="btn btn-green" onclick="addStudent()">+ Add Student</button></td><td colspan="999"></td></tr>`;
$("tableBody").innerHTML=body;

students.forEach(st=>{
list.forEach(sub=>{
calculateSubject(st.id,sub,"t1");
calculateSubject(st.id,sub,"t2");
});
calculateOverall(st.id);
});
}

function renderGroup(st,sub,term,group,arr){
let html="";
arr.forEach((item,i)=>{
if(item[0]==="ମୋଟ"){
html+=`<td id="total_${st.id}_${safe(sub)}_${term}_${group}" class="total-col total-value">0</td>`;
}else{
const value=getMarks(st,sub,term,group,i);
html+=`<td class="component-col"><input type="number" min="0" max="${item[1]}" step="0.5" class="mark-input" value="${esc(value)}" data-id="${st.id}" data-subject="${esc(sub)}" data-term="${term}" data-group="${group}" data-index="${i}" oninput="markChanged(this)"></td>`;
}
});
return html;
}

function markChanged(input){
const id=input.dataset.id,sub=input.dataset.subject,term=input.dataset.term,group=input.dataset.group,index=Number(input.dataset.index);
const st=students.find(x=>x.id===id);
if(!st)return;
st.marks??={};st.marks[sub]??={};st.marks[sub][term]??={};st.marks[sub][term][group]??={};
let value=input.value===""?"":Number(input.value);
const max=Number(input.max);
if(value!==""&&value>max)value=max,input.value=max;
if(value!==""&&value<0)value=0,input.value=0;
st.marks[sub][term][group][index]=value;
calculateSubject(id,sub,term);
calculateOverall(id);
}

function calculateSubject(id,sub,term){
const st=students.find(x=>x.id===id);if(!st)return;
const s=getStructure(currentClass,sub);
let total=0;
["formative","observation","summative"].forEach(group=>{
let gt=0;
s[group].forEach((item,i)=>{
if(item[0]==="ମୋଟ"){
const el=$(`total_${id}_${safe(sub)}_${term}_${group}`);
if(el)el.textContent=formatNumber(gt);
total+=gt;gt=0;
}else{
const v=getMarks(st,sub,term,group,i);
if(v!==""&&v!==undefined&&v!==null)gt+=Number(v)||0;
}
});
});
const p=$(`percent_${id}_${safe(sub)}_${term}`);
if(p)p.textContent=total.toFixed(1)+"%";
}

function formatNumber(n){return Number.isInteger(n)?String(n):n.toFixed(1)}

function calculateOverall(id){
const st=students.find(x=>x.id===id);if(!st)return;
const max=currentClass<=5?600:900;
let t1=0,t2=0;
(subjects[currentClass]||[]).forEach(sub=>{
const s=getStructure(currentClass,sub);
["formative","observation","summative"].forEach(group=>{
s[group].forEach((item,i)=>{
if(item[0]!=="ମୋଟ"){
const v1=getMarks(st,sub,"t1",group,i),v2=getMarks(st,sub,"t2",group,i);
if(v1!==""&&v1!==undefined&&v1!==null)t1+=Number(v1)||0;
if(v2!==""&&v2!==undefined&&v2!==null)t2+=Number(v2)||0;
}
});
});
});
const p1=max?(t1/max)*100:0,p2=max?(t2/max)*100:0;
const e1=$(`overall_t1_${id}`),e2=$(`overall_t2_${id}`);
if(e1)e1.innerHTML=`${formatNumber(t1)}/${max}<br><b>${p1.toFixed(1)}%</b>`;
if(e2)e2.innerHTML=`${formatNumber(t2)}/${max}<br><b>${p2.toFixed(1)}%</b>`;
}

function addStudent(){
students.push({id:uid(),name:"",gender:"",marks:{}});
renderTable();
saveLocal(false);
}

function updateName(id,value){
const st=students.find(x=>x.id===id);if(st)st.name=value.toUpperCase();
}

function updateGender(id,value){
const st=students.find(x=>x.id===id);if(st)st.gender=value;
}

function loadClass(){
currentClass=Number($("classSelect").value);
const key=`odisha_assessment_class_${currentClass}`;
const saved=localStorage.getItem(key);
if(saved){
try{students=JSON.parse(saved)}catch(e){students=[]}
}else{
students=[];
for(let i=0;i<5;i++)students.push({id:uid(),name:"",gender:"",marks:{}});
}
renderTable();
$("status").textContent=`Class ${currentClass} loaded successfully. Overall: ${currentClass<=5?600:900} marks per term.`;
}

function saveLocal(show=true){
localStorage.setItem(`odisha_assessment_class_${currentClass}`,JSON.stringify(students));
if(show)$("status").textContent=`Class ${currentClass} assessment data saved successfully.`;
}

function clearAllData(){
if(!confirm(`Class ${currentClass} ର ସମସ୍ତ assessment data delete କରିବେ କି?`))return;
localStorage.removeItem(`odisha_assessment_class_${currentClass}`);
students=[];
for(let i=0;i<5;i++)students.push({id:uid(),name:"",gender:"",marks:{}});
renderTable();
$("status").textContent=`Class ${currentClass} data cleared.`;
}

function calculateGroupTotal(st,sub,term,group,arr){
let total=0;
arr.forEach((item,i)=>{
if(item[0]!=="ମୋଟ"){
const v=getMarks(st,sub,term,group,i);
if(v!==""&&v!==undefined&&v!==null)total+=Number(v)||0;
}
});
return total;
}

function calculateSubjectNumber(st,sub,term){
const s=getStructure(currentClass,sub);let total=0;
["formative","observation","summative"].forEach(group=>{
s[group].forEach((item,i)=>{
if(item[0]!=="ମୋଟ"){
const v=getMarks(st,sub,term,group,i);
if(v!==""&&v!==undefined&&v!==null)total+=Number(v)||0;
}
});
});
return total;
}

function exportExcel(){
const list=subjects[currentClass],rows=[],header=["Roll No","Student Name","Gender"];

list.forEach(sub=>{
const s=getStructure(currentClass,sub);
function addHeader(arr,term){arr.forEach(item=>header.push(`${sub} - ${term} - ${item[0]}`))}
addHeader(s.formative,"ଗଠନମୂଳକ ଆକଳନ–୧");
addHeader(s.observation,"ଶିକ୍ଷକ ପର୍ଯ୍ୟବେକ୍ଷଣ–୧");
addHeader(s.summative,"ସମାପ୍ତିସୂଚକ ଆକଳନ–୧");
header.push(`${sub} - TERM 1 %`);
addHeader(s.formative,"ଗଠନମୂଳକ ଆକଳନ–୨");
addHeader(s.observation,"ଶିକ୍ଷକ ପର୍ଯ୍ୟବେକ୍ଷଣ–୨");
addHeader(s.summative,"ସମାପ୍ତିସୂଚକ ଆକଳନ–୨");
header.push(`${sub} - TERM 2 %`);
});
header.push("TERM 1 OVERALL %","TERM 2 OVERALL %");
rows.push(header);

students.forEach((st,index)=>{
const row=[index+1,st.name||"",st.gender||""];
list.forEach(sub=>{
const s=getStructure(currentClass,sub);
function addData(group,arr,term){
arr.forEach((item,i)=>{
if(item[0]==="ମୋଟ")row.push(calculateGroupTotal(st,sub,term,group,arr));
else row.push(getMarks(st,sub,term,group,i));
});
}
addData("formative",s.formative,"t1");
addData("observation",s.observation,"t1");
addData("summative",s.summative,"t1");
row.push(calculateSubjectNumber(st,sub,"t1").toFixed(1)+"%");
addData("formative",s.formative,"t2");
addData("observation",s.observation,"t2");
addData("summative",s.summative,"t2");
row.push(calculateSubjectNumber(st,sub,"t2").toFixed(1)+"%");
});
const max=currentClass<=5?600:900;
const t1=list.reduce((a,s)=>a+calculateSubjectNumber(st,s,"t1"),0);
const t2=list.reduce((a,s)=>a+calculateSubjectNumber(st,s,"t2"),0);
row.push(`${t1}/${max} = ${((t1/max)*100).toFixed(1)}%`,`${t2}/${max} = ${((t2/max)*100).toFixed(1)}%`);
rows.push(row);
});

const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,`Class ${currentClass}`);
XLSX.writeFile(wb,`OdishaPathasala_Assessment_Class_${currentClass}.xlsx`);
$("status").textContent="Excel file downloaded successfully.";
}

$("classSelect").value="3";
loadClass();
</script>
</body>
