<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Class Study Materials - odishapathasala.in</title>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* General Reset */
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    /* Header Style matching main page */
    header {
        background-color: #0b192c;
        color: #ffffff;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        flex-wrap: wrap;
        gap: 15px;
    }
    .logo-area {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
    }
    .logo-icon {
        background: #0044cc;
        color: #ffffff;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
    }
    .logo-text h1 {
        font-size: 18px;
        margin: 0;
        color: #ffffff;
        font-weight: bold;
    }
    .logo-text p {
        font-size: 11px;
        margin: 0;
        color: #94a3b8;
    }
    .nav-links {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }
    .nav-links a {
        text-decoration: none;
        color: #cbd5e1;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: color 0.2s;
    }
    .nav-links a:hover {
        color: #ffffff;
    }

    .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 20px;
        flex: 1;
        width: 100%;
        box-sizing: border-box;
    }
    h2 {
        color: #1e293b;
        text-align: center;
        margin-bottom: 30px;
        font-size: 28px;
    }
    h2 span {
        color: #0044cc;
    }

    /* Grid and Colorful Cards */
    .grid-classes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
    }
    
    .class-card {
        padding: 28px 20px;
        border-radius: 16px;
        text-align: center;
        text-decoration: none;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .class-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }

    /* ପ୍ରତ୍ୟେକ କ୍ଲାସ ପାଇଁ ଆକର୍ଷକ ଗ୍ରାଡିଏଣ୍ଟ୍ ରଙ୍ଗ */
    .card-purple { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
    .card-blue   { background: linear-gradient(135deg, #48dbfb, #0abde3); }
    .card-red    { background: linear-gradient(135deg, #ff6b6b, #ee5253); }
    .card-green  { background: linear-gradient(135deg, #1dd1a1, #10ac84); }
    .card-orange { background: linear-gradient(135deg, #ff9f43, #ff6348); }

    .class-title {
        font-size: 22px;
        font-weight: bold;
        color: #ffffff;
        margin-bottom: 6px;
    }
    .class-sub {
        color: rgba(255, 255, 255, 0.9);
        font-size: 15px;
        font-weight: 500;
    }

    .back-btn {
        display: inline-block;
        margin-bottom: 20px;
        text-decoration: none;
        color: #0044cc;
        font-weight: bold;
        font-size: 14px;
    }
    .back-btn:hover {
        text-decoration: underline;
    }

    /* Footer Style */
    footer {
        background-color: #0b192c;
        color: #94a3b8;
        text-align: center;
        padding: 20px;
        font-size: 14px;
        margin-top: auto;
    }
    footer span {
        color: #ffffff;
        font-weight: 600;
    }
</style>
</head>
<body>

<!-- Header Section -->
<header>
    <a href="index.html" class="logo-area">
        <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <div class="logo-text">
            <h1>Odisha Pathasala</h1>
            <p>Simple Digital Learning Resource</p>
        </div>
    </a>
    <div class="nav-links">
        <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="book-library.html"><i class="fa-solid fa-book"></i> Book Library</a>
        <a href="video-gallery.html"><i class="fa-solid fa-video"></i> Video Gallery</a>
        <a href="question-bank.html"><i class="fa-solid fa-clipboard-question"></i> Question Bank</a>
    </div>
</header>

<!-- Main Content Section -->
<div class="container">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    
    <h2>Select Your <span>Class</span></h2>
    
    <div class="grid-classes">
        <!-- Class 4 -->
        <a href="class4-subjects.html" class="class-card card-purple">
            <div class="class-title">Class 4</div>
            <div class="class-sub">ଚତୁର୍ଥ ଶ୍ରେଣୀ</div>
        </a>

        <!-- Class 5 -->
        <a href="class5-subjects.html" class="class-card card-blue">
            <div class="class-title">Class 5</div>
            <div class="class-sub">ପଞ୍ଚମ ଶ୍ରେଣୀ</div>
        </a>

        <!-- Class 6 -->
        <a href="class6-subjects.html" class="class-card card-red">
            <div class="class-title">Class 6</div>
            <div class="class-sub">ଷଷ୍ଠ ଶ୍ରେଣୀ</div>
        </a>

        <!-- Class 7 -->
        <a href="class7-subjects.html" class="class-card card-green">
            <div class="class-title">Class 7</div>
            <div class="class-sub">ସପ୍ତମ ଶ୍ରେଣୀ</div>
        </a>

        <!-- Class 8 -->
        <a href="class8-subjects.html" class="class-card card-orange">
            <div class="class-title">Class 8</div>
            <div class="class-sub">ଅଷ୍ଟମ ଶ୍ରେଣୀ</div>
        </a>
    </div>
</div>

<!-- Footer Section -->
<footer>
    <p>&copy; 2026 <span>Odisha Pathasala</span>. All Rights Reserved.</p>
</footer>

</body>
</html>
