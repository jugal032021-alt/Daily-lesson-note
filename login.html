<!DOCTYPE html>
<html lang="or">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Login - Odishapathasala.in</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .auth-container {
            max-width: 400px;
            margin: 60px auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .auth-container h2 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn-auth {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-auth:hover {
            background-color: #0056b3;
        }

        .extra-links {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 14px;
        }

        .extra-links a {
            color: #007bff;
            text-decoration: none;
            cursor: pointer;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .toggle-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="auth-container">

        <h2 id="formTitle">
            ୟୁଜର୍ ଲଗଇନ୍ (User Login)
        </h2>


        <form id="authForm">


            <!-- NAME -->

            <div class="form-group"
                 id="nameGroup"
                 style="display:none;">

                <label>
                    ନାମ (Name):
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="ଆପଣଙ୍କ ପୂରା ନାମ ଲେଖନ୍ତୁ">

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    ଇମେଲ୍ (Email):
                </label>

                <input
                    type="email"
                    id="email"
                    required
                    placeholder="example@email.com">

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    ପାସୱାର୍ଡ (Password):
                </label>

                <input
                    type="password"
                    id="password"
                    required
                    placeholder="********">

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="btn-auth"
                id="submitBtn">

                ଲଗଇନ୍ କରନ୍ତୁ

            </button>


            <!-- FORGOT PASSWORD -->

            <div
                class="extra-links"
                id="forgotPasswordLink">

                <span></span>

                <a onclick="forgotPassword()">

                    ପାସୱାର୍ଡ ଭୁଲିଯାଇଛନ୍ତି?
                    (Forgot Password)

                </a>

            </div>


        </form>


        <!-- TOGGLE -->

        <div class="toggle-text">

            <p id="toggleMsg">

                ଆକାଉଣ୍ଟ୍ ନାହିଁ?

                <a onclick="toggleMode()">
                    ସାଇନ୍ ଅପ୍ (Sign up) କରନ୍ତୁ
                </a>

            </p>

        </div>


    </div>

</div>



<!-- ========================================= -->
<!-- FIREBASE LIBRARIES -->
<!-- ========================================= -->

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>



<script>


// =========================================
// FIREBASE CONFIGURATION
// =========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyCq18Y1jPbJ8P3kTpiKlq05OBILPVDQLYE",

    authDomain:
        "daily-lesson-note.firebaseapp.com",

    databaseURL:
        "https://daily-lesson-note-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "daily-lesson-note",

    storageBucket:
        "daily-lesson-note.firebasestorage.app",

    messagingSenderId:
        "902287150460",

    appId:
        "1:902287150460:web:90bd366eb30a4aeae268f9",

    measurementId:
        "G-LRSYL5Y9HF"

};


// =========================================
// INITIALIZE FIREBASE
// =========================================

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const auth = firebase.auth();

let isLogin = true;



// =========================================
// TOGGLE LOGIN / SIGN UP
// =========================================

function toggleMode() {

    isLogin = !isLogin;


    const formTitle =
        document.getElementById("formTitle");

    const nameGroup =
        document.getElementById("nameGroup");

    const submitBtn =
        document.getElementById("submitBtn");

    const toggleMsg =
        document.getElementById("toggleMsg");

    const forgotPasswordLink =
        document.getElementById("forgotPasswordLink");


    if (isLogin) {


        formTitle.innerText =
            "ୟୁଜର୍ ଲଗଇନ୍ (User Login)";


        nameGroup.style.display =
            "none";


        submitBtn.innerText =
            "ଲଗଇନ୍ କରନ୍ତୁ";


        forgotPasswordLink.style.display =
            "flex";


        toggleMsg.innerHTML =

            `ଆକାଉଣ୍ଟ୍ ନାହିଁ?

            <a onclick="toggleMode()">
                ସାଇନ୍ ଅପ୍ (Sign up) କରନ୍ତୁ
            </a>`;


    } else {


        formTitle.innerText =
            "ଆକାଉଣ୍ଟ୍ ତିଆରି କରନ୍ତୁ (Sign up)";


        nameGroup.style.display =
            "block";


        submitBtn.innerText =
            "ରେଜିଷ୍ଟର୍ କରନ୍ତୁ";


        forgotPasswordLink.style.display =
            "none";


        toggleMsg.innerHTML =

            `ପୂର୍ବରୁ ଆକାଉଣ୍ଟ୍ ଅଛି?

            <a onclick="toggleMode()">
                ଲଗଇନ୍ କରନ୍ତୁ
            </a>`;

    }

}



// =========================================
// FORGOT PASSWORD
// =========================================

function forgotPassword() {


    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();


    if (!email) {

        alert(
            "ଦୟାକରି ପ୍ରଥମେ Email ID ଲେଖନ୍ତୁ!"
        );

        return;

    }


    auth.sendPasswordResetEmail(email)

    .then(() => {


        alert(

            "ପାସୱାର୍ଡ ରିସେଟ୍ ଲିଙ୍କ୍ " +
            "ଆପଣଙ୍କ Email କୁ ପଠାଯାଇଛି!\n\n" +

            "Gmail Inbox ଏବଂ Spam/Junk folder " +
            "ଚେକ୍ କରନ୍ତୁ।"

        );

    })


    .catch((error) => {


        console.error(error);


        if (
            error.code ===
            "auth/user-not-found"
        ) {


            alert(

                "ଏହି Email ର Firebase " +
                "Authentication ରେ account ମିଳିଲା ନାହିଁ।\n\n" +

                "ଯଦି ଆପଣ ପୁରୁଣା user, " +
                "ତେବେ ପ୍ରଥମେ ଆପଣଙ୍କ ପୁରୁଣା password " +
                "ଦେଇ ଥରେ Login କରନ୍ତୁ।\n\n" +

                "ତାପରେ Forgot Password କାମ କରିବ।"

            );

        } else {


            alert(

                "ସମସ୍ୟା ହେଲା:\n" +
                error.message

            );

        }

    });

}



// =========================================
// AUTH FORM SUBMIT
// =========================================

document
.getElementById("authForm")
.addEventListener(
    "submit",
    function(e) {


        e.preventDefault();


        const email =

            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        const password =

            document
            .getElementById("password")
            .value;



        // =================================
        // LOGIN
        // =================================

        if (isLogin) {


            // ---------------------------------
            // STEP 1
            // Check Firestore old user
            // ---------------------------------

            db.collection("users")

            .where(
                "email",
                "==",
                email
            )

            .limit(1)

            .get()


            .then((snapshot) => {


                // ---------------------------------
                // USER NOT FOUND IN FIRESTORE
                // ---------------------------------

                if (snapshot.empty) {


                    // Try Firebase Authentication

                    return auth
                    .signInWithEmailAndPassword(
                        email,
                        password
                    )

                    .then(
                        loginSuccess
                    )

                    .catch((error) => {

                        throw error;

                    });

                }



                // ---------------------------------
                // OLD USER FOUND
                // ---------------------------------

                const doc =
                    snapshot.docs[0];


                const userData =
                    doc.data();



                // ---------------------------------
                // Already migrated?
                // ---------------------------------

                if (
                    userData.migratedToAuth === true
                ) {


                    return auth
                    .signInWithEmailAndPassword(
                        email,
                        password
                    )

                    .then(
                        loginSuccess
                    );

                }



                // ---------------------------------
                // OLD PASSWORD CHECK
                // ---------------------------------

                if (
                    userData.password !==
                    password
                ) {


                    alert(
                        "Email କିମ୍ବା Password ଭୁଲ୍ ଅଛି!"
                    );

                    return;

                }



                // ---------------------------------
                // MIGRATE OLD USER
                // ---------------------------------

                return auth
                .createUserWithEmailAndPassword(
                    email,
                    password
                )

                .then(
                    (userCredential) => {


                        const uid =
                            userCredential.user.uid;


                        // Update SAME old document
                        // Random document ID remains unchanged

                        return doc.ref.set(

                            {

                                name:
                                    userData.name || "",

                                email:
                                    email,

                                authUid:
                                    uid,

                                migratedToAuth:
                                    true

                            },

                            {
                                merge: true
                            }

                        );

                    }

                )

                .then(() => {


                    localStorage.setItem(
                        "isLoggedIn",
                        "true"
                    );


                    localStorage.setItem(
                        "userEmail",
                        email
                    );


                    alert(

                        "ପୁରୁଣା account ସଫଳତାର ସହ " +
                        "update ହୋଇଗଲା!\n\n" +

                        "ବର୍ତ୍ତମାନ ଆପଣ Firebase Authentication " +
                        "ଦ୍ୱାରା Login କରିପାରିବେ।"

                    );


                    window.location.href =
                        "index.html";

                });


            })


            .catch((error) => {


                console.error(error);


                // Firebase Auth error

                if (

                    error.code ===
                    "auth/wrong-password"

                    ||

                    error.code ===
                    "auth/invalid-credential"

                ) {


                    alert(
                        "Email କିମ୍ବା Password ଭୁଲ୍ ଅଛି!"
                    );


                }


                else if (

                    error.code ===
                    "auth/user-not-found"

                ) {


                    alert(

                        "ଏହି Email ପାଇଁ " +
                        "କୌଣସି account ମିଳିଲା ନାହିଁ!"

                    );

                }


                else {


                    alert(

                        "Login ସମସ୍ୟା:\n" +
                        error.message

                    );

                }

            });


        }



        // =================================
        // SIGN UP
        // =================================

        else {


            const name =

                document
                .getElementById("name")
                .value
                .trim();



            if (!name) {


                alert(
                    "ଦୟାକରି ଆପଣଙ୍କ ନାମ ଲେଖନ୍ତୁ!"
                );

                return;

            }



            // ---------------------------------
            // Create Firebase Auth account
            // ---------------------------------

            auth
            .createUserWithEmailAndPassword(
                email,
                password
            )

            .then(
                (userCredential) => {


                    const uid =
                        userCredential.user.uid;


                    // ---------------------------------
                    // Save profile in Firestore
                    // ---------------------------------

                    return db
                    .collection("users")
                    .add({

                        name:
                            name,

                        email:
                            email,

                        authUid:
                            uid,

                        migratedToAuth:
                            true,

                        createdAt:
                            firebase.firestore
                            .FieldValue
                            .serverTimestamp()

                    });

                }

            )

            .then(() => {


                alert(

                    name +
                    " ଙ୍କ account ସଫଳତାର ସହ " +
                    "ତିଆରି ହୋଇଗଲା!\n\n" +

                    "ବର୍ତ୍ତମାନ Login କରନ୍ତୁ।"

                );


                return auth.signOut();

            })


            .then(() => {


                toggleMode();

            })


            .catch((error) => {


                console.error(error);


                if (

                    error.code ===
                    "auth/email-already-in-use"

                ) {


                    alert(

                        "ଏହି Email ରେ ପୂର୍ବରୁ " +
                        "account ଅଛି।\n\n" +

                        "ଦୟାକରି Login କରନ୍ତୁ " +
                        "କିମ୍ବା Forgot Password ବ୍ୟବହାର କରନ୍ତୁ।"

                    );

                }


                else {


                    alert(

                        "Sign up ସମସ୍ୟା:\n" +
                        error.message

                    );

                }

            });

        }

    }
);



// =========================================
// LOGIN SUCCESS FUNCTION
// =========================================

function loginSuccess(userCredential) {


    localStorage.setItem(
        "isLoggedIn",
        "true"
    );


    localStorage.setItem(
        "userEmail",
        userCredential.user.email
    );


    alert(

        userCredential.user.email +
        " ଲଗଇନ୍ ସଫଳ ହେଲା!"

    );


    window.location.href =
        "index.html";

}


</script>

</body>

</html>
