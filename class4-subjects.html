<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 4 Subjects - odishapathasala.in</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #0066cc;
            font-weight: bold;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            color: #1a298b;
            margin-bottom: 30px;
            font-size: 28px;
        }

        h2 span {
            color: #0066cc;
        }

        .grid-subjects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .subject-card {
            padding: 20px;
            border-radius: 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }

        .subject-card:hover {
            transform: translateY(-4px);
        }

        /* କାର୍ଡ଼ର ବିଭିନ୍ନ ରଙ୍ଗ (Gradient) */
        .card-red { background: linear-gradient(135deg, #ff6b6b, #ee5253); }
        .card-purple { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .card-blue { background: linear-gradient(135deg, #48dbfb, #0abde3); }
        .card-green { background: linear-gradient(135deg, #1dd1a1, #10ac84); }

        .card-content {
            display: flex;
            align-items: center;
        }

        /* ବହି ଫଟୋର ଆକାର ଏବଂ ଡିଜାଇନ୍ */
        .book-cover-img {
            width: 50px;
            height: 65px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 15px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            background: #fff;
        }

        .sub-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }

        .open-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="classes.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Classes</a>

        <h2>Class 4 <span>Subjects</span></h2>

        <div class="grid-subjects">
            
            <!-- 1. Bhasa Mahak -->
            <a href="class4-bhasa-chapters.html" class="subject-card card-purple">
                <div class="card-content">
                    <img src="images/bhasa-mahak.jpg" alt="Book" class="book-cover-img">
                    <span class="sub-name">ଭାଷା ମହକ - ୪</span>
                </div>
                <div class="open-btn">Open <i class="fa-solid fa-arrow-right"></i></div>
            </a>

            <!-- 2. Ganita Khela -->
            <a href="class4-ganita-chapters.html" class="subject-card card-blue">
                <div class="card-content">
                    <img src="images/ganita.jpg" alt="Book" class="book-cover-img">
                    <span class="sub-name">ଗଣିତ ଖେଳ</span>
                </div>
                <div class="open-btn">Open <i class="fa-solid fa-arrow-right"></i></div>
            </a>

            <!-- 3. Pallavi -->
            <a href="class4-pallavi-chapters.html" class="subject-card card-red">
                <div class="card-content">
                    <img src="images/pallavi.jpg" alt="Book" class="book-cover-img">
                    <span class="sub-name">Pallavi</span>
                </div>
                <div class="open-btn">Open <i class="fa-solid fa-arrow-right"></i></div>
            </a>

            <!-- 4. Ama Bichitra Biswa -->
            <a href="class4-world-chapters.html" class="subject-card card-green">
                <div class="card-content">
                    <img src="images/ama-biswa.jpg" alt="Book" class="book-cover-img">
                    <span class="sub-name">ଆମ ବିଚିତ୍ର ବିଶ୍ୱ</span>
                </div>
                <div class="open-btn">Open <i class="fa-solid fa-arrow-right"></i></div>
            </a>

        </div>
    </div>

</body>
</html>
