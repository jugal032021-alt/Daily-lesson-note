<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Odishapathasala.in</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .container { max-width: 400px; margin: 80px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #eef0f5; }
        h2 { text-align: center; color: #003399; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
        .btn-auth { width: 100%; background-color: #1a8c3a; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-auth:hover { background-color: #146c2e; }
        .cancel-btn { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>ପାସୱାର୍ଡ ବଦଳାନ୍ତୁ</h2>
    <form id="changePasswordForm">
        <div class="form-group">
            <label>ନୂଆ ପାସୱାର୍ଡ (New Password):</label>
            <input type="password" id="newPassword" required placeholder="ନୂଆ ପାସୱାର୍ଡ ଲେଖନ୍ତୁ (ମିନିମମ୍ ୬ ଅକ୍ଷର)">
        </div>
        <div class="form-group">
            <label>ପୁଣିଥରେ ଲେଖନ୍ତୁ (Confirm Password):</label>
            <input type="password" id="confirmPassword" required placeholder="ପୁଣିଥରେ ସେହି ନୂଆ ପାସୱାର୍ଡ ଲେଖନ୍ତୁ">
        </div>
        <button type="submit" class="btn-auth" id="updateBtn">ସେଭ୍ କରନ୍ତୁ (Update Password)</button>
        <a href="index.html" class="cancel-btn">ବାତିଲ୍ କରନ୍ତୁ (Cancel)</a>
    </form>
</div>

<!-- FIREBASE LIBRARIES -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
// FIREBASE CONFIGURATION
const firebaseConfig = {
    apiKey: "AIzaSyCq18Y1jPbJ8P3kTpiKlq05OBILPVDQLYE",
    authDomain: "daily-lesson-note.firebaseapp.com",
    databaseURL: "https://daily-lesson-note-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "daily-lesson-note",
    storageBucket: "daily-lesson-note.firebasestorage.app",
    messagingSenderId: "902287150460",
    appId: "1:902287150460:web:90bd366eb30a4aeae268f9",
    measurementId: "G-LRSYL5Y9HF"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// CHANGE PASSWORD LOGIC
document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const newPass = document.getElementById('newPassword').value;
    const confPass = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('updateBtn');

    if (newPass.length < 6) {
        alert("ସୁରକ୍ଷା ପାଇଁ ପାସୱାର୍ଡ ସର୍ବନିମ୍ନ ୬ ଅକ୍ଷର କିମ୍ବା ସଂଖ୍ୟା ହେବା ଦରକାର!");
        return;
    }

    if (newPass !== confPass) {
        alert("ଦୁଇଟି ଯାକ ପାସୱାର୍ଡ ସମାନ ହେଉନାହିଁ। ଦୟାକରି ଠିକ୍ ଭାବେ ଲେଖନ୍ତୁ।");
        return;
    }

    const user = auth.currentUser;

    if (user) {
        btn.innerText = "ଦୟାକରି ଅପେକ୍ଷା କରନ୍ତୁ...";
        btn.disabled = true;

        user.updatePassword(newPass)
        .then(() => {
            return db.collection("users").where("authUid", "==", user.uid).get();
        })
        .then((snapshot) => {
            if (!snapshot.empty) {
                snapshot.docs[0].ref.update({
                    password: newPass
                });
            }
            alert("ଆପଣଙ୍କର ପାସୱାର୍ଡ ସଫଳତାର ସହ ବଦଳିଗଲା!");
            window.location.href = "index.html"; 
        })
        .catch((error) => {
            btn.innerText = "ସେଭ୍ କରନ୍ତୁ (Update Password)";
            btn.disabled = false;

            if (error.code === 'auth/requires-recent-login') {
                alert("ସୁରକ୍ଷା କାରଣରୁ, ପାସୱାର୍ଡ ବଦଳାଇବା ପାଇଁ ଦୟାକରି ଆଉଥରେ ଲଗ୍‌ଇନ୍ କରନ୍ତୁ ଏବଂ ତା'ପରେ ଚେଷ୍ଟା କରନ୍ତୁ।");
                auth.signOut().then(() => {
                    window.location.href = "login.html";
                });
            } else {
                alert("ସମସ୍ୟା ହେଲା: " + error.message);
            }
        });
    } else {
        alert("ଏହି କାମ କରିବା ପାଇଁ ଆପଣଙ୍କୁ ପ୍ରଥମେ ଲଗ୍‌ଇନ୍ କରିବାକୁ ପଡ଼ିବ!");
        window.location.href = "login.html";
    }
});
</script>

</body>
</html>
