<!doctype html><html lang="or"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Assessment Report Card</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://accounts.google.com/gsi/client"></script><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;font-family:Arial,sans-serif}.top{background:linear-gradient(110deg,#0670b5,#078fd0);color:#fff;text-align:center;padding:9px;border-bottom:4px solid #ffd21c}.top h2{margin:0;font-size:19px}.top small{color:#ffe600;font-weight:bold}.panel{max-width:1200px;margin:7px auto;padding:8px;background:#fff;border-radius:8px;box-shadow:0 2px 7px #bbb}.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}select,input,button,textarea{padding:7px;border:1px solid #aaa;border-radius:5px;font-size:13px}button{background:#0873b9;color:#fff;border:0;font-weight:bold}.green{background:#19853d}.orange{background:#e77b24}#status{font-size:11px;color:#16833b;margin-top:4px}.report{position:relative;width:210mm;min-height:297mm;margin:12px auto;padding:12mm 9mm;background:#fff;border:2px solid #1595d0;box-shadow:0 2px 10px #aaa;overflow:hidden}.report:before,.report:after{content:"";position:absolute;left:0;right:0;height:22px;background:linear-gradient(135deg,#087bc1 0 40%,#ffd21c 40% 48%,#087bc1 48%);z-index:0}.report:before{top:0}.report:after{bottom:0}.content{position:relative;z-index:1}.school{text-align:center;border-bottom:2px solid #267c9f;padding-bottom:7px;margin-top:5px}.head{display:flex;align-items:center;justify-content:space-between}.ico{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;background:#e9f7ff;border:3px solid #087bc1}.ico.r{background:#effbea;border-color:#35a85a}.school h1{margin:0;color:#123f70;font-size:23px}.school p{margin:2px;font-size:11px;font-weight:bold}.title{text-align:center;margin:7px}.title h2{display:inline-block;margin:0;padding:5px 15px;background:linear-gradient(90deg,#d82b79,#b81765);color:#fff;border-radius:7px;font-size:16px}.title p{margin:4px;font-weight:bold;font-size:13px}.info,.marks{width:100%;border-collapse:collapse}.info{font-size:11px;margin:7px 0}.info td{border:1px solid #71828c;padding:5px}.lbl{background:#e9f4ff;font-weight:bold;color:#17385e}.marks{font-size:9px;table-layout:fixed}.marks th,.marks td{border:1px solid #71828c;padding:3px;text-align:center}.marks th:first-child{width:26%}.subject{text-align:left!important;font-weight:bold;padding-left:6px!important;font-size:10px}.a{background:#f5bfd0}.b{background:#b9dcf4}.c{background:#ccebc8}.t1{background:#fff0f4}.t2{background:#edf7ff}.ann{background:#effbea;font-weight:bold}.total td{background:#fff5c9;font-weight:bold}.result{display:flex;gap:6px;margin-top:7px}.box{flex:1;padding:6px;text-align:center;border:1px solid #9aa;background:#f8fbff;font-size:11px;font-weight:bold}.box b{display:block;font-size:16px;color:#102b4d;margin-top:2px}.pink{background:#fff0f4}.blue{background:#edf7ff}.gb{background:#effbea}.remarks{margin-top:8px;padding:7px;border:1px solid #d1b75e;border-radius:6px;background:#fffbea}.remarks b{font-size:12px;color:#17385e}textarea{width:100%;height:55px;margin-top:3px}.sign{display:flex;justify-content:space-between;margin-top:50px;text-align:center;font-size:10px}.sig{width:30%}.line{border-top:1px solid #222;margin-bottom:4px}.motto{text-align:center;margin-top:22px;color:#1c7740;font-weight:bold;font-style:italic}.footer{text-align:center;margin-top:9px;font-size:9px;color:#075e9c;font-weight:bold}.watermark{text-align:center;margin-top:4px;font-size:9px;color:#777;opacity:.45;font-weight:bold}@media(max-width:700px){.report{width:100%;min-height:auto;padding:24px 8px 18px}.school h1{font-size:17px}.ico{width:44px;height:44px;font-size:23px}.school p{font-size:8px}.title h2{font-size:12px}.title p{font-size:10px}.info{font-size:8px}.marks{font-size:6.5px}.marks th,.marks td{padding:2px 1px}.subject{font-size:7px}.box{font-size:8px;padding:4px}.box b{font-size:12px}.sign{margin-top:35px;font-size:8px}}@media print{body{background:#fff}.top,.panel{display:none!important}.report{margin:0;box-shadow:none;width:210mm;min-height:297mm;padding:10mm 9mm}@page{size:A4 portrait;margin:0}}
</style></head><body><div class="top"><h2>📊 STUDENT ASSESSMENT REPORT CARD</h2><small>OdishaPathasala.in</small></div><div class="panel"><div class="row"><select id="cls"><option value="">-- Select Class --</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select><button onclick="loadDrive()">☁️ Load Assessment</button><select id="student" onchange="makeReport()" style="min-width:210px"><option value="">-- Select Student --</option></select><button class="green" onclick="printReport()">🖨️ Print A4</button></div><div class="row"><input id="sn" placeholder="School Name" style="min-width:230px"><input id="block" placeholder="Block"><input id="district" placeholder="District"><input id="state" value="Odisha" placeholder="State"><input id="udise" placeholder="UDISE Code"><button class="orange" onclick="saveSchool()">💾 Save School Details</button></div><div id="status">Select Class and load assessment.</div></div><div class="report"><div class="content" id="reportContent"><div style="text-align:center;padding-top:280px;color:#777">Student report will appear here.</div></div></div><script>
const CID="779998626577-u1iau2cj8i0ip2fjob5n789pfeu00htt.apps.googleusercontent.com",SCOPE="https://www.googleapis.com/auth/drive.file";let token,tc,wb,ws,cls;
const BOOKS={3:["ଭାଷା ମହକ","Pallavi","ଗଣିତ ମେଳା","ଆମ ବିଚିତ୍ର ବିଶ୍ୱ","ଇନ୍ଦ୍ରଧନୁ","ଖେଳ ଓ ଯୋଗ"],4:["ଭାଷା ମହକ","Pallavi","ଗଣିତ ମେଳା","ଆମ ବିଚିତ୍ର ବିଶ୍ୱ","ଇନ୍ଦ୍ରଧନୁ","କ୍ରୀଡ଼ା ଓ ଯୋଗ"],5:["ଭାଷା ମହକ","Pallavi","ଗଣିତ ମେଳା","ଆମ ବିଚିତ୍ର ବିଶ୍ୱ","ନବରସ","ଖେଳ ଓ ଯୋଗ"],6:["ସାହିତ୍ୟ ସୁଧା","Jasmine","ଗଣିତ ପ୍ରକାଶ","ଜିଜ୍ଞାସା","ଭାରତ ଓ ଆମ ପୃଥିବୀ","ହିନ୍ଦୀ କଳିକା","କଳାକୁଞ୍ଜ","କୌଶଳ ବୋଧ","ଖେଳ ଶିକ୍ଷା"],7:["ସାହିତ୍ୟ ସୁମନ","Jasmine","ଗଣିତ ପ୍ରକାଶ","ଜିଜ୍ଞାସା","ଭାରତ ଓ ଆମ ପୃଥିବୀ","ହିନ୍ଦୀ କଳିକା","କୌଶଳ ବୋଧ","କଳାକୃତି","ଖେଳ ଶିକ୍ଷା"],8:["ସାହିତ୍ୟ ସୁରଭି","Jasmine","ଗଣିତ ପ୍ରକାଶ","ଜିଜ୍ଞାସା","ଭାରତ ଓ ଆମ ପୃଥିବୀ","ହିନ୍ଦୀ କଳିକା","କୌଶଳ ବୋଧ","କୃତି","ଖେଳ ଶିକ୍ଷା"]};
const $=id=>document.getElementById(id),V=(r,c)=>ws[XLSX.utils.encode_col(c)+r]?.v??"",E=x=>String(x).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function status(x){$("status").textContent=x}
function loadSchool(){let d=JSON.parse(localStorage.school_details||"{}");["sn","block","district","state","udise"].forEach(x=>$(x).value=d[x]||"")}loadSchool();
function saveSchool(){let d={};["sn","block","district","state","udise"].forEach(x=>d[x]=$(x).value);localStorage.school_details=JSON.stringify(d);status("✅ School details saved");makeReport()}
addEventListener("load",()=>tc=google.accounts.oauth2.initTokenClient({client_id:CID,scope:SCOPE,callback:r=>{if(r.error)return status("❌ Google login failed");token=r.access_token;status("✅ Google Drive connected");getFile()}}));
function loadDrive(){cls=$("cls").value;if(!cls)return alert("Select Class first");token?getFile():tc.requestAccessToken({prompt:"consent"})}
async function getFile(){try{let n=`OdishaPathasala_Assessment_Class_${cls}.xlsx`,q=`name='${n}' and trashed=false`,u="https://www.googleapis.com/drive/v3/files?spaces=drive&q="+encodeURIComponent(q)+"&fields=files(id,name)";status("☁️ Searching your Drive...");let r=await fetch(u,{headers:{Authorization:"Bearer "+token}}),d=await r.json();if(!d.files?.length)return status("❌ Assessment file not found in your Drive");status("☁️ Loading assessment...");r=await fetch(`https://www.googleapis.com/drive/v3/files/${d.files[0].id}?alt=media`,{headers:{Authorization:"Bearer "+token}});wb=XLSX.read(await r.arrayBuffer(),{type:"array"});ws=wb.Sheets["Class "+cls];fill();status("✅ Assessment loaded. Select student.")}catch(e){status("❌ "+e.message)}}
function fill(){let s=$("student");s.innerHTML='<option value="">-- Select Student --</option>';for(let r=4;r<=65;r++)if(String(V(r,1)).trim()){let o=document.createElement("option");o.value=r;o.textContent=`${V(r,0)||r-3} - ${V(r,1)}`;s.appendChild(o)}}
function makeReport(){let r=+$("student").value;if(!r||!ws)return;let B=BOOKS[cls],n=B.length,t1=0,t2=0,h=`<div class="school"><div class="head"><div class="ico">📚</div><div style="flex:1"><h1>${E($("sn").value||"SCHOOL NAME")}</h1><p>Block – ${E($("block").value)} | District – ${E($("district").value)} | ${E($("state").value||"Odisha")}</p><p>UDISE Code: ${E($("udise").value)}</p></div><div class="ico r">🎓</div></div></div><div class="title"><h2>STUDENT ASSESSMENT REPORT CARD</h2><p>Academic Session: 2026–27</p></div><table class="info"><tr><td class="lbl">Student Name</td><td><b>${E(V(r,1))}</b></td><td class="lbl">Roll No.</td><td><b>${E(V(r,0))}</b></td></tr><tr><td class="lbl">Class</td><td><b>${cls}</b></td><td class="lbl">Gender</td><td><b>${E(V(r,2))}</b></td></tr></table><table class="marks"><tr><th rowspan="2">Subject</th><th colspan="4" class="a">TERM 1 (100)</th><th colspan="4" class="b">TERM 2 (100)</th><th rowspan="2" class="c">Annual<br>Total<br>(200)</th></tr><tr><th class="a">FA1<br>(25)</th><th class="a">Obs.<br>(25)</th><th class="a">SA1<br>(50)</th><th class="a">Total</th><th class="b">FA2<br>(25)</th><th class="b">Obs.<br>(25)</th><th class="b">SA2<br>(50)</th><th class="b">Total</th></tr>`;
B.forEach((b,i)=>{let c=3+i*8,a=+V(r,c)||0,o=+V(r,c+1)||0,s=+V(r,c+2)||0,a2=+V(r,c+4)||0,o2=+V(r,c+5)||0,s2=+V(r,c+6)||0,x=a+o+s,y=a2+o2+s2;t1+=x;t2+=y;h+=`<tr><td class="subject">${E(b)}</td><td class="t1">${a}</td><td class="t1">${o}</td><td class="t1">${s}</td><td class="t1"><b>${x}</b></td><td class="t2">${a2}</td><td class="t2">${o2}</td><td class="t2">${s2}</td><td class="t2"><b>${y}</b></td><td class="ann">${x+y}</td></tr>`});
let m=n*100,p1=t1/m*100,p2=t2/m*100,an=t1+t2,am=n*200,op=an/am*100;
h+=`<tr class="total"><td>TOTAL</td><td colspan="3"></td><td>${t1}</td><td colspan="3"></td><td>${t2}</td><td>${an}</td></tr></table><div class="result"><div class="box pink">TERM 1 TOTAL<b>${t1}/${m}</b></div><div class="box pink">TERM 1 %<b>${p1.toFixed(2)}%</b></div><div class="box blue">TERM 2 TOTAL<b>${t2}/${m}</b></div><div class="box blue">TERM 2 %<b>${p2.toFixed(2)}%</b></div></div><div class="result"><div class="box gb">ANNUAL TOTAL<b>${an}/${am}</b></div><div class="box gb">OVERALL PERCENTAGE<b>${op.toFixed(2)}%</b></div></div><div class="remarks"><b>Teacher's Remarks:</b><textarea placeholder="Enter remarks before printing..."></textarea></div><div class="sign"><div class="sig"><div class="line"></div>H.M. Signature</div><div class="sig"><div class="line"></div>Teacher's Signature</div><div class="sig"><div class="line"></div>Parent's Signature</div></div><div class="motto">🌿 Keep Learning, Keep Growing! 🌿</div><div class="footer">📖 Better Students | 👨‍🎓 Every Child Matters | 🎯 Small Steps, Big Achievements</div><div class="watermark">odishapathasala.in</div>`;
$("reportContent").innerHTML=h}
function printReport(){if(!$("student").value)return alert("Select a student first");print()}
</script></body></html>
