<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Assessment Report Card</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;font-family:Arial,sans-serif;color:#111}
.top{background:linear-gradient(110deg,#064b96,#087bc1);color:#fff;text-align:center;padding:12px}
.top h2{margin:2px;font-size:21px}.top small{color:#ffe600;font-weight:bold}
.panel{max-width:1200px;margin:10px auto;padding:10px;background:#fff;border-radius:9px;box-shadow:0 2px 8px #bbb}
select,input,button,textarea{padding:8px;border:1px solid #aaa;border-radius:5px;font-size:14px}
button{background:#075e9c;color:#fff;border:0;font-weight:bold;cursor:pointer;margin:3px}.green{background:#16833b}.orange{background:#e67e22}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}.row>*{margin:2px}.hide{display:none}
#status{font-size:12px;color:#075e9c;margin-top:5px}
.report{position:relative;max-width:900px;min-height:1120px;margin:15px auto;background:#fff;padding:28px 30px;box-shadow:0 2px 10px #aaa;overflow:hidden}
.water{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.water span{font-size:70px;font-weight:bold;color:#000;opacity:.045;transform:rotate(-35deg)}
.content{position:relative;z-index:1}
.school{text-align:center;border-bottom:2px solid #075e9c;padding-bottom:8px}
.school h1{font-size:24px;margin:0 0 4px;color:#075e9c}.school p{margin:2px;font-size:13px;font-weight:bold}
.title{text-align:center;margin:10px 0}.title h2{margin:2px;font-size:19px;color:#222}.title p{margin:3px;font-weight:bold}
.info{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}.info td{border:1px solid #888;padding:6px}.lbl{font-weight:bold;background:#edf5ff}
.marks{width:100%;border-collapse:collapse;font-size:11px}.marks th,.marks td{border:1px solid #777;padding:5px;text-align:center}.marks th{background:#dceeff}.marks .sub{text-align:left;font-weight:bold}
.term1{background:#ffe0e8}.term2{background:#e6ddff}.annual{background:#dff5df;font-weight:bold}
.result{display:flex;gap:10px;margin-top:10px}.box{flex:1;border:1px solid #777;padding:8px;text-align:center;background:#f8fbff}.box b{display:block;font-size:18px;margin-top:3px}
textarea{width:100%;height:60px;resize:none;margin-top:4px}.remarks{margin-top:10px;font-size:13px;font-weight:bold}
.sign{display:flex;justify-content:space-between;margin-top:65px;text-align:center;font-size:12px}.sig{width:28%}.line{border-top:1px solid #222;margin-bottom:5px}
.footer{text-align:center;margin-top:20px;font-size:10px;color:#666}
@media(max-width:600px){.report{padding:18px 12px;min-height:1000px}.school h1{font-size:19px}.marks{font-size:9px}.marks th,.marks td{padding:3px}.title h2{font-size:16px}.result{gap:4px}.box{padding:5px}.box b{font-size:15px}.sign{margin-top:45px}.water span{font-size:45px}}
@media print{
 body{background:#fff}.top,.panel{display:none!important}.report{margin:0;box-shadow:none;width:210mm;min-height:297mm;padding:12mm;page-break-after:avoid}
 @page{size:A4 portrait;margin:0}
}
</style>
</head>
<body>

<div class="top">
<h2>📊 STUDENT ASSESSMENT REPORT CARD</h2>
<small>OdishaPathasala.in</small>
</div>

<div class="panel">
<div class="row">
<select id="cls">
<option value="">-- Select Class --</option>
<option value="3">Class 3</option><option value="4">Class 4</option>
<option value="5">Class 5</option><option value="6">Class 6</option>
<option value="7">Class 7</option><option value="8">Class 8</option>
</select>
<button onclick="loadDrive()">☁️ Load Assessment</button>
<select id="student" onchange="makeReport()" style="min-width:220px">
<option value="">-- Select Student --</option>
</select>
<button class="green" onclick="printReport()">🖨️ Print A4</button>
</div>
<div class="row">
<input id="sn" placeholder="School Name" style="min-width:250px">
<input id="block" placeholder="Block">
<input id="district" placeholder="District">
<input id="state" placeholder="State" value="Odisha">
<input id="udise" placeholder="UDISE Code">
<button class="orange" onclick="saveSchool()">💾 Save School Details</button>
</div>
<div id="status">Select Class and load assessment.</div>
</div>

<div id="report" class="report">
<div class="water"><span>odishapathasala.in</span></div>
<div class="content" id="reportContent">
<div style="text-align:center;padding-top:300px;color:#777">Student report will appear here.</div>
</div>
</div>

<script>
const CID="779998626577-u1iau2cj8i0ip2fjob5n789pfeu00htt.apps.googleusercontent.com";
const SCOPE="https://www.googleapis.com/auth/drive.file";
let token=null,tc=null,wb=null,ws=null,cls="",students=[];

const BOOKS={
3:["ଭାଷା ମହକ","Pallavi","ଗଣିତ ମେଳା","ଆମ ବିଚିତ୍ର ବିଶ୍ୱ","ଇନ୍ଦ୍ରଧନୁ","ଖେଳ ଓ ଯୋଗ"],
4:["ଭାଷା ମହକ","Pallavi","ଗଣିତ ମେଳା","ଆମ ବିଚିତ୍ର ବିଶ୍ୱ","ଇନ୍ଦ୍ରଧନୁ","କ୍ରୀଡ଼ା ଓ ଯୋଗ"],
5:["ଭାଷା ମହକ","Pallavi","ଗଣିତ ମେଳା","ଆମ ବିଚିତ୍ର ବିଶ୍ୱ","ନବରସ","ଖେଳ ଓ ଯୋଗ"],
6:["ସାହିତ୍ୟ ସୁଧା","Jasmine","ଗଣିତ ପ୍ରକାଶ","ଜିଜ୍ଞାସା","ଭାରତ ଓ ଆମ ପୃଥିବୀ","ହିନ୍ଦୀ କଳିକା","କଳାକୁଞ୍ଜ","କୌଶଳ ବୋଧ","ଖେଳ ଶିକ୍ଷା"],
7:["ସାହିତ୍ୟ ସୁମନ","Jasmine","ଗଣିତ ପ୍ରକାଶ","ଜିଜ୍ଞାସା","ଭାରତ ଓ ଆମ ପୃଥିବୀ","ହିନ୍ଦୀ କଳିକା","କୌଶଳ ବୋଧ","କଳାକୃତି","ଖେଳ ଶିକ୍ଷା"],
8:["ସାହିତ୍ୟ ସୁରଭି","Jasmine","ଗଣିତ ପ୍ରକାଶ","ଜିଜ୍ଞାସା","ଭାରତ ଓ ଆମ ପୃଥିବୀ","ହିନ୍ଦୀ କଳିକା","କୌଶଳ ବୋଧ","କୃତି","ଖେଳ ଶିକ୍ଷା"]
};

function status(x){document.getElementById("status").textContent=x}

function loadSchool(){
 let d=JSON.parse(localStorage.getItem("school_details")||"{}");
 ["sn","block","district","state","udise"].forEach(x=>document.getElementById(x).value=d[x]||"");
}
function saveSchool(){
 let d={};["sn","block","district","state","udise"].forEach(x=>d[x]=document.getElementById(x).value);
 localStorage.setItem("school_details",JSON.stringify(d));
 status("✅ School details saved");
 makeReport();
}
loadSchool();

window.addEventListener("load",()=>{
 try{
  tc=google.accounts.oauth2.initTokenClient({
   client_id:CID,scope:SCOPE,
   callback:r=>{
    if(r.error){status("❌ Google login failed");return}
    token=r.access_token;status("✅ Google Drive connected");getDriveFile();
   }
  });
 }catch(e){status("❌ Google initialization failed")}
});

function loadDrive(){
 cls=document.getElementById("cls").value;
 if(!cls)return alert("Select Class first");
 if(!token)tc.requestAccessToken({prompt:"consent"});
 else getDriveFile();
}

async function getDriveFile(){
 try{
  let name=`OdishaPathasala_Assessment_Class_${cls}.xlsx`;
  status("☁️ Searching your Drive...");
  let q=`name='${name}' and trashed=false`;
  let u="https://www.googleapis.com/drive/v3/files?spaces=drive&q="+encodeURIComponent(q)+"&fields=files(id,name)&pageSize=10";
  let r=await fetch(u,{headers:{Authorization:"Bearer "+token}});
  if(!r.ok)throw Error("Drive search failed");
  let d=await r.json();
  if(!d.files?.length){status("❌ Assessment file not found in your Drive");return}
  let f=d.files[0];
  status("☁️ Loading assessment...");
  r=await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,{headers:{Authorization:"Bearer "+token}});
  if(!r.ok)throw Error("File download failed");
  wb=XLSX.read(await r.arrayBuffer(),{type:"array"});
  ws=wb.Sheets["Class "+cls];
  if(!ws)throw Error("Class sheet not found");
  fillStudents();status("✅ Assessment loaded. Select student.");
 }catch(e){status("❌ "+e.message)}
}

function v(r,c){let x=ws[XLSX.utils.encode_col(c)+r];return x?.v??""}

function fillStudents(){
 let s=document.getElementById("student");s.innerHTML='<option value="">-- Select Student --</option>';students=[];
 for(let r=4;r<=65;r++){
  let name=String(v(r,1)||"").trim();
  if(name){
   students.push({r,name,roll:v(r,0)||r-3,gender:v(r,2)||""});
   let o=document.createElement("option");o.value=r;o.textContent=(v(r,0)||r-3)+" - "+name;s.appendChild(o);
  }
 }
}

function makeReport(){
 let r=Number(document.getElementById("student").value);if(!r||!ws)return;
 let books=BOOKS[cls],n=books.length,t1=0,t2=0;
 let html=`<div class="school"><h1>${esc(document.getElementById("sn").value||"SCHOOL NAME")}</h1><p>Block – ${esc(document.getElementById("block").value)} | District – ${esc(document.getElementById("district").value)} | ${esc(document.getElementById("state").value||"Odisha")}</p><p>UDISE Code: ${esc(document.getElementById("udise").value)}</p></div>`;
 html+=`<div class="title"><h2>STUDENT ASSESSMENT REPORT CARD</h2><p>Academic Session: 2026–27</p></div>`;
 html+=`<table class="info"><tr><td class="lbl">Student Name</td><td>${esc(v(r,1))}</td><td class="lbl">Roll No.</td><td>${esc(v(r,0))}</td></tr><tr><td class="lbl">Class</td><td>${cls}</td><td class="lbl">Gender</td><td>${esc(v(r,2))}</td></tr></table>`;
 html+=`<table class="marks"><tr><th>Subject</th><th colspan="4" class="term1">TERM 1</th><th colspan="4" class="term2">TERM 2</th><th class="annual">Annual</th></tr><tr><th></th><th>FA1</th><th>Obs.</th><th>SA1</th><th>Total</th><th>FA2</th><th>Obs.</th><th>SA2</th><th>Total</th><th>Total</th></tr>`;
 books.forEach((b,i)=>{
  let c=3+i*8,a=+v(r,c)||0,o=+v(r,c+1)||0,s=+v(r,c+2)||0,a2=+v(r,c+4)||0,o2=+v(r,c+5)||0,s2=+v(r,c+6)||0;
  let x=a+o+s,y=a2+o2+s2;t1+=x;t2+=y;
  html+=`<tr><td class="sub">${esc(b)}</td><td>${a}</td><td>${o}</td><td>${s}</td><td>${x}</td><td>${a2}</td><td>${o2}</td><td>${s2}</td><td>${y}</td><td>${x+y}</td></tr>`;
 });
 let max=n*100,p1=max?t1/max*100:0,p2=max?t2/max*100:0,annual=t1+t2,amax=n*200,overall=amax?annual/amax*100:0;
 html+=`</table><div class="result"><div class="box">TERM 1 TOTAL<b>${t1}/${max}</b></div><div class="box">TERM 1 %<b>${p1.toFixed(2)}%</b></div><div class="box">TERM 2 TOTAL<b>${t2}/${max}</b></div><div class="box">TERM 2 %<b>${p2.toFixed(2)}%</b></div></div>`;
 html+=`<div class="result"><div class="box">ANNUAL TOTAL<b>${annual}/${amax}</b></div><div class="box">OVERALL PERCENTAGE<b>${overall.toFixed(2)}%</b></div></div>`;
 html+=`<div class="remarks">Teacher's Remarks:<textarea placeholder="Enter remarks before printing..."></textarea></div>`;
 html+=`<div class="sign"><div class="sig"><div class="line"></div>H.M. Signature</div><div class="sig"><div class="line"></div>Teacher's Signature</div><div class="sig"><div class="line"></div>Parent's Signature</div></div>`;
 html+=`<div class="footer">Generated from OdishaPathasala.in</div>`;
 document.getElementById("reportContent").innerHTML=html;
}

function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function printReport(){if(!document.getElementById("student").value)return alert("Select a student first");window.print()}
</script>
</body>
</html>
