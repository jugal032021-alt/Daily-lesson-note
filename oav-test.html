<!DOCTYPE html>
<html lang="or">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>OAV-2026 Online Test</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="oav-test.css">

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="oav-header">

    <div class="oav-logo">

        <span>📝</span>

        <div>

            <h2>OAV-2026</h2>

            <small>Online Practice Test</small>

        </div>

    </div>


    <div id="timerDisplay">

        ⏳ Time Left:

        <strong id="timeRemaining">
            30:00
        </strong>

    </div>

</header>



<!-- ================= MAIN ================= -->

<main class="oav-test-container">


    <!-- TEST INFORMATION -->

    <div id="testInfoBar">

        <div id="lblTestName">
            Test: Loading...
        </div>

        <div id="lblSubject">
            Subject: Loading...
        </div>

        <div id="lblTotalMarks">
            Marks: 30
        </div>

    </div>



    <!-- ================= STATUS ================= -->

    <div id="testStatusMsg">

        Test loading...

    </div>



    <!-- ================= QUESTION ================= -->

    <div id="questionBox"
         style="display:none;">


        <div class="question-header">

            <h3 id="qNumberTitle">
                Question 1 of 30
            </h3>

        </div>



        <!-- QUESTION -->

        <div class="question-area">

            <p id="qText">
                Question loading...
            </p>

        </div>



        <!-- OPTIONS -->

        <div id="optionsContainer">

        </div>



        <!-- BUTTONS -->

        <div class="test-buttons">


            <button
                id="btnPrev"
                onclick="prevQuestion()">

                ← Previous

            </button>



            <button
                id="btnNext"
                onclick="nextQuestion()">

                Next →

            </button>



            <button
                id="btnSubmitTest"
                onclick="confirmSubmitTest()">

                Submit Test

            </button>


        </div>


    </div>


</main>
