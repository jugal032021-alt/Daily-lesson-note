<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Lesson Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>ଡେଲି ଲେସନ୍ ନୋଟ୍</h2>
            <p>Govt. Elementary School </p>
        </div>
        <div class="content">
            <p style="text-align:center; color:#555;">ଆଜିର ନୋଟ୍ ଖୋଜିବା ପାଇଁ ତାରିଖ, ଶ୍ରେଣୀ ଓ ବିଷୟ ବାଛନ୍ତୁ</p>

            <div class="form-group">
                <label for="searchDate">ତାରିଖ ବାଛନ୍ତୁ :</label>
                <input type="date" id="searchDate">
            </div>

            <div class="form-group">
                <label for="searchClass">ଶ୍ରେଣୀ ବାଛନ୍ତୁ :</label>
                <select id="searchClass" aria-label="ଶ୍ରେଣୀ ବାଛନ୍ତୁ" required>
                    <option value="">ଶ୍ରେଣୀ ବାଛନ୍ତୁ</option>
                    <option value="Class 1">Class ୧</option>
                    <option value="Class 2">Class ୨</option>
                    <option value="Class 3">Class ୩</option>
                    <option value="Class 4">Class ୪</option>
                    <option value="Class 5">Class ୫</option>
                    <option value="Class 6">Class ୬</option>
                    <option value="Class 7">Class ୭</option>
                    <option value="Class 8">Class ୮</option>
                </select>
            </div>

            <div class="form-group">
                <label for="searchSubject">ବିଷୟ ବାଛନ୍ତୁ (Subject):</label>
                <select id="searchSubject" aria-label="ବିଷୟ ବାଛନ୍ତୁ" required>
                    <option value="">ପ୍ରଥମେ ଶ୍ରେଣୀ ବାଛନ୍ତୁ</option>
                </select>
            </div>

            <button onclick="searchNote()">ଖୋଜନ୍ତୁ (Search)</button>

            <!-- ଏଠାରେ ଫଳ ଦେଖାଯିବ -->
            <div id="resultArea"></div>
        </div>
    </div>
    <script src="app.js"></script>
    
    
</body>
</html>
