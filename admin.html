<!DOCTYPE html>
<html lang="or">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Upload/Edit Lesson Note</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .edit-section { background-color: #ffebd6; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ff9900; }
        .edit-section h3 { margin-top: 0; color: #cc6600; font-size: 16px; }
        .btn-search { background-color: #007bff; }
        .btn-update { background-color: #ff9900; display: none; }
        .btn-delete { background-color: #dc3545; display: none; }
        .btn-submit { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>ଶିକ୍ଷକ ଆଡମିନ୍ ପ୍ୟାନେଲ୍</h2>
            <p>ଆଜିର ନୋଟ୍ ଅପଲୋଡ୍ କିମ୍ବା ପୁରୁଣା ନୋଟ୍ ଏଡିଟ୍ କରନ୍ତୁ</p>
        </div>
            <!-- AI Auto-Fill Section -->
    <div style="background: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #4CAF50;">
        <h3 style="color: #2e7d32; margin-top: 0;">✨ ଫାଷ୍ଟ୍ ଅଟୋ-ଫିଲ୍ (Copy-Paste)</h3>
        <p style="font-size: 13px; color: #555; margin-bottom: 8px;">ଆପଣଙ୍କ ପଞ୍ଚପଦି ନୋଟ୍ ଏଠାରେ ପେଷ୍ଟ୍ କରନ୍ତୁ:</p>
        <textarea id="aiRawInput" rows="5" placeholder="ଏଠାରେ ପଞ୍ଚପଦି ନୋଟ୍ ପେଷ୍ଟ୍ କରନ୍ତୁ..." style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-family: inherit;"></textarea>
        <button type="button" onclick="autoFillPanchpadi()" style="background: #4CAF50; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-top: 8px; font-weight: bold;">
            🚀 ଫର୍ମରେ ଭର୍ତ୍ତି କରନ୍ତୁ
        </button>
    </div>

        <div class="content">
            
            <!-- ପୁରୁଣା ଖୋଜିବା ବିଭାଗ (ଏଡିଟ୍ ପାଇଁ) -->
            <div class="edit-section">
                <h3>ସୁଧାରିବା ପାଇଁ ପୁରୁଣା ନୋଟ୍ ଖୋଜନ୍ତୁ</h3>
                <div class="form-group">
                    <label>ତାରିଖ:</label>
                    <input type="date" id="searchEditDate">
                </div>
                <div class="form-group">
                    <label>ଶ୍ରେଣୀ:</label>
                    <select id="searchEditClass">
                        <option value="">ଶ୍ରେଣୀ ବାଛନ୍ତୁ</option>
                        <option value="Class 1">Class 1</option>
                        <option value="Class 2">Class 2</option>
                        <option value="Class 3">Class 3</option>
                        <option value="Class 4">Class 4</option>
                        <option value="Class 5">Class 5</option>
                        <option value="Class 6">Class 6</option>
                        <option value="Class 7">Class 7</option>
                        <option value="Class 8">Class 8</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ବିଷୟ (Subject):</label>
                    <select id="searchEditSubject">
                        <option value="">ପ୍ରଥମେ ଶ୍ରେଣୀ ବାଛନ୍ତୁ</option>
                    </select>
                </div>
                <button class="btn-search" onclick="fetchNoteForEdit()">ନୋଟ୍ ଖୋଜନ୍ତୁ</button>
            </div>

            <hr style="margin-bottom: 20px; border: 0; border-top: 1px solid #ccc;">

            <!-- ମୁଖ୍ୟ ଫର୍ମ ବିଭାଗ -->
            <p style="text-align:center; font-weight:bold; color:#0056b3;" id="modeText">ନୂଆ ଲେସନ୍ ନୋଟ୍ ଟାଇପ୍ କରନ୍ତୁ</p>
            <input type="hidden" id="noteId">

            <div class="form-group"><label>ତାରିଖ:</label><input type="date" id="date" required></div>
            <div class="form-group">
                <label>ଶ୍ରେଣୀ :</label>
                <select id="className" onchange="updateAdminSubjects()" required>
                    <option value="">ଶ୍ରେଣୀ ବାଛନ୍ତୁ</option>
                    <option value="Class 1">Class 1</option>
                    <option value="Class 2">Class 2</option>
                    <option value="Class 3">Class 3</option>
                    <option value="Class 4">Class 4</option>
                    <option value="Class 5">Class 5</option>
                    <option value="Class 6">Class 6</option>
                    <option value="Class 7">Class 7</option>
                    <option value="Class 8">Class 8</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>କାଳାଂଶ (Period):</label>
                <input type="text" id="period" required>
            </div>
            
            <div class="form-group">
                <label>ବିଷୟ (Subject):</label>
                <select id="subject" required>
                    <option value="">ପ୍ରଥମେ ଶ୍ରେଣୀ ବାଛନ୍ତୁ</option>
                </select>
            </div>
                
            <div class="form-group"><label>ପାଠ୍ୟ ପ୍ରସଙ୍ଗ (Topic):</label><input type="text" id="topic"></div>
            <div class="form-group"><label>ଶିକ୍ଷଣ ଫଳାଫଳ (Learning Outcomes):</label><textarea id="outcomes"></textarea></div>
            <div class="form-group"><label>ଶିକ୍ଷଣ ସାମଗ୍ରୀ (TLM):</label><textarea id="tlm"></textarea></div>

            <div class="section-title">ପଞ୍ଚପଦୀ ଶିକ୍ଷାଦାନ (5-Steps)</div>
            <div class="form-group"><label>୧. ଅଧିତି (Engage):</label><textarea id="adhiti"></textarea></div>
            <div class="form-group"><label>୨. ବୋଧ (Explain):</label><textarea id="bodha"></textarea></div>
            <div class="form-group"><label>୩. ଅଭ୍ୟାସ (Explore):</label><textarea id="abhyasa"></textarea></div>
            <div class="form-group"><label>୪. ପ୍ରୟୋଗ (Elaborate):</label><textarea id="prayoga"></textarea></div>
            <div class="form-group"><label>୫. ପ୍ରସାର (Evaluate):</label><textarea id="prasara"></textarea></div>

            <!-- ବଟନ୍ ଗୁଡିକ -->
            <button id="btnSubmit" class="btn-submit" onclick="saveNote()">ନୂଆ ନୋଟ୍ ଅପଲୋଡ୍ କରନ୍ତୁ</button>
            <button id="btnUpdate" class="btn-update" onclick="updateNote()">ପରିବର୍ତ୍ତନ କୁ ସେଭ୍ କରନ୍ତୁ (Update)</button>
            <button id="btnDelete" class="btn-delete" onclick="deleteNote()">ଏହି ନୋଟ୍ କୁ ଡିଲିଟ୍ କରନ୍ତୁ</button>
        </div>
    </div>
<script>
function autoFillPanchpadi() {
    const rawText = document.getElementById('aiRawInput').value;
    if(!rawText.trim()) {
        alert("ଦୟାକରି କିଛି ଲେଖା ପେଷ୍ଟ୍ କରନ୍ତୁ!");
        return;
    }

    const lines = rawText.split('\n');
    
    lines.forEach(line => {
        const lowerLine = line.toLowerCase();
        
        if (lowerLine.includes('ତାରିଖ') || lowerLine.includes('date')) {
            const val = line.split(':')[1] || line.split('-')[1];
            if(val) document.getElementById('date').value = val.trim();
        }
        else if (lowerLine.includes('ଶ୍ରେଣୀ') || lowerLine.includes('class')) {
            const val = line.split(':')[1];
            if(val) document.getElementById('className').value = val.trim();
        }
        else if (lowerLine.includes('କାଳାଂଶ') || lowerLine.includes('period')) {
            const val = line.split(':')[1];
            if(val) document.getElementById('period').value = val.trim();
        }
        else if (lowerLine.includes('ବିଷୟ') || lowerLine.includes('subject')) {
            const val = line.split(':')[1];
            if(val) {
                const subjSelect = document.getElementById('subject');
                let found = false;
                for(let opt of subjSelect.options) {
                    if(opt.value.toLowerCase().includes(val.trim().toLowerCase())) {
                        subjSelect.value = opt.value;
                        found = true;
                        break;
                    }
                }
                if(!found) {
                    let opt = document.createElement('option');
                    opt.value = val.trim();
                    opt.innerHTML = val.trim();
                    subjSelect.appendChild(opt);
                    subjSelect.value = val.trim();
                }
            }
        }
        else if (lowerLine.includes('ପାଠ୍ୟ ପ୍ରସଙ୍ଗ') || lowerLine.includes('topic')) {
            const val = line.split(':')[1];
            if(val) document.getElementById('topic').value = val.trim();
        }
        else if (lowerLine.includes('ଶିକ୍ଷଣ ଫଳାଫଳ') || lowerLine.includes('outcomes')) {
            const val = line.substring(line.indexOf(':') + 1);
            if(val) document.getElementById('outcomes').value = val.trim();
        }
        else if (lowerLine.includes('ଶିକ୍ଷଣ ସାମଗ୍ରୀ') || lowerLine.includes('tlm')) {
            const val = line.substring(line.indexOf(':') + 1);
            if(val) document.getElementById('tlm').value = val.trim();
        }
        else if (lowerLine.includes('ଅଧିତି') || lowerLine.includes('engage')) {
            const val = line.substring(line.indexOf(':') + 1);
            if(val) document.getElementById('adhiti').value = val.trim();
        }
        else if (lowerLine.includes('ବୋଧ') || lowerLine.includes('explain')) {
            const val = line.substring(line.indexOf(':') + 1);
            if(val) document.getElementById('bodha').value = val.trim();
        }
        else if (lowerLine.includes('ଅଭ୍ୟାସ') || lowerLine.includes('explore')) {
            const val = line.substring(line.indexOf(':') + 1);
            if(val) document.getElementById('abhyasa').value = val.trim();
        }
        else if (lowerLine.includes('ପ୍ରୟୋଗ') || lowerLine.includes('elaborate')) {
            const val = line.substring(line.indexOf(':') + 1);
            if(val) document.getElementById('prayoga').value = val.trim();
        }
                else if (lowerLine.includes('ପ୍ରସାର') || lowerLine.includes('evaluate')) {
            const parts = line.split(':');
            const val = parts.length > 1 ? parts[1] : line.substring(line.indexOf(')') + 1);
            if(val) document.getElementById('prasar').value = val.trim();
        }

        }
    });

    alert("ସଫଳତାର ସହ ସବୁ ଘର ଭର୍ତ୍ତି ହୋଇଗଲା! ଥରେ ଚେକ୍ କରି 'Submit' କରନ୍ତୁ।");
}
</script>

    
    <script src="app.js"></script>
</body>
</html>
